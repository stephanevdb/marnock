name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marnock-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  macos:
    name: Build macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Swift build
        working-directory: macos/Marnock
        run: swift build -c release

      - name: Package .app
        working-directory: macos/Marnock
        run: |
          set -euo pipefail
          BIN="$(swift build -c release --show-bin-path)/Marnock"
          APP="Marnock.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp Marnock/Info.plist "$APP/Contents/Info.plist"
          cp "$BIN" "$APP/Contents/MacOS/Marnock"
          chmod +x "$APP/Contents/MacOS/Marnock"
          if [ -f Marnock/Resources/AppIcon.icns ]; then
            cp Marnock/Resources/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          elif [ -f ../../branding/Marnock.icns ]; then
            cp ../../branding/Marnock.icns "$APP/Contents/Resources/AppIcon.icns"
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP" Marnock-macos.zip

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: marnock-macos
          path: macos/Marnock/Marnock-macos.zip
          if-no-files-found: error

  relay-image:
    name: Build & publish relay image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/marnock-relay
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: relay
          file: relay/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Multi-arch on publish; single arch on PRs (faster smoke build).
          platforms: ${{ github.event_name != 'pull_request' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}