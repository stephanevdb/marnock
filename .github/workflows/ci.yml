name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Used by Release workflow: GITHUB_TOKEN tag pushes do not re-trigger this file.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.v.outputs.version_name }}
      version_code: ${{ steps.v.outputs.version_code }}
      is_release: ${{ steps.v.outputs.is_release }}
      tag_name: ${{ steps.v.outputs.tag_name }}
    steps:
      - id: v
        run: |
          # Tag push or workflow_dispatch --ref vX.Y.Z (from Release workflow).
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
            IS_RELEASE=true
          else
            TAG=""
            VER="0.0.0-dev"
            IS_RELEASE=false
          fi
          IFS=. read -r MAJ MIN PAT <<<"${VER%%-*}"
          MAJ=${MAJ:-0}; MIN=${MIN:-0}; PAT=${PAT:-0}
          CODE=$((MAJ * 10000 + MIN * 100 + PAT))
          if [[ "$CODE" -lt 1 ]]; then CODE=1; fi
          echo "version_name=$VER" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved version_name=$VER version_code=$CODE is_release=$IS_RELEASE tag=$TAG ref=$GITHUB_REF"

  android:
    name: Build Android
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Assemble release APK
        working-directory: android
        env:
          VERSION_NAME: ${{ needs.version.outputs.version_name }}
          VERSION_CODE: ${{ needs.version.outputs.version_code }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APK for release
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Marnock-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marnock-android
          path: Marnock-android.apk
          if-no-files-found: error

  macos:
    name: Build macOS
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Swift build
        working-directory: macos/Marnock
        run: swift build -c release

      - name: Package .app
        working-directory: macos/Marnock
        env:
          VERSION_NAME: ${{ needs.version.outputs.version_name }}
          VERSION_CODE: ${{ needs.version.outputs.version_code }}
        run: |
          set -euo pipefail
          BIN="$(swift build -c release --show-bin-path)/Marnock"
          APP="Marnock.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          # Inject marketing + build version into Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION_NAME}" Marnock/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${VERSION_CODE}" Marnock/Info.plist
          cp Marnock/Info.plist "$APP/Contents/Info.plist"
          cp "$BIN" "$APP/Contents/MacOS/Marnock"
          chmod +x "$APP/Contents/MacOS/Marnock"
          if [ -f Marnock/Resources/AppIcon.icns ]; then
            cp Marnock/Resources/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          elif [ -f ../../branding/Marnock.icns ]; then
            cp ../../branding/Marnock.icns "$APP/Contents/Resources/AppIcon.icns"
          fi
          if command -v codesign >/dev/null 2>&1; then
            codesign --force --deep --sign - \
              --entitlements Marnock/Marnock.entitlements \
              "$APP" 2>/dev/null || codesign --force --deep --sign - "$APP"
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP" Marnock-macos.zip
          cp Marnock-macos.zip ../../Marnock-macos.zip

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: marnock-macos
          path: Marnock-macos.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: needs.version.outputs.is_release == 'true'
    needs: [version, android, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: marnock-android
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: marnock-macos
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag_name }}
          name: Marnock ${{ needs.version.outputs.version_name }}
          generate_release_notes: true
          files: |
            dist/Marnock-android.apk
            dist/Marnock-macos.zip

  homebrew-cask:
    name: Update Homebrew cask
    if: needs.version.outputs.is_release == 'true'
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: marnock-macos
          path: dist

      - name: Bump Casks/marnock.rb
        env:
          VERSION_NAME: ${{ needs.version.outputs.version_name }}
        run: |
          chmod +x scripts/update-homebrew-cask.sh
          ./scripts/update-homebrew-cask.sh "$VERSION_NAME" dist/Marnock-macos.zip

      - name: Bump Formula/marnock.rb source url
        env:
          VERSION_NAME: ${{ needs.version.outputs.version_name }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Source tarball for the tag (created by GitHub from the pushed tag).
          curl -fsSL -o /tmp/marnock-src.tar.gz \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          SRC_SHA="$(sha256sum /tmp/marnock-src.tar.gz | awk '{print $1}')"
          FORMULA=Formula/marnock.rb
          tmp="$(mktemp)"
          awk -v ver="$VERSION_NAME" -v sha="$SRC_SHA" -v repo="$GITHUB_REPOSITORY" '
            /^  url "/ {
              print "  url \"https://github.com/" repo "/archive/refs/tags/v" ver ".tar.gz\""
              next
            }
            /^  sha256 "/ { print "  sha256 \"" sha "\""; next }
            { print }
          ' "$FORMULA" >"$tmp"
          mv "$tmp" "$FORMULA"
          echo "Updated $FORMULA → v${VERSION_NAME} sha256=${SRC_SHA}"

      - name: Commit and push Homebrew metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/marnock.rb Formula/marnock.rb
          if git diff --staged --quiet; then
            echo "No Homebrew metadata changes"
            exit 0
          fi
          git commit -m "chore(homebrew): bump marnock to ${{ needs.version.outputs.version_name }}"
          # Rebase if main moved; retry once.
          git pull --rebase origin main || true
          git push origin HEAD:main

  relay-image:
    name: Build & publish relay image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/marnock-relay
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: relay
          file: relay/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ github.event_name != 'pull_request' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
